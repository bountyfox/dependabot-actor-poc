name: Sync Dependabot changeset
on:
  pull_request_target:
    paths:
      - '**/yarn.lock'
permissions:
  contents: read
  pull-requests: write
jobs:
  log-context:
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger context (no gate)
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          ACTION: ${{ github.event.action }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          echo "actor=$ACTOR triggering_actor=$TRIGGER action=$ACTION sender=$SENDER"
          echo "pr_author=$PR_AUTHOR head_repo=$HEAD_REPO"
  generate-changeset:
    runs-on: ubuntu-latest
    # identical gate to backstage/backstage sync_dependabot-changesets.yml:15
    if: github.actor == 'dependabot[bot]' && github.repository == 'bountyfox/dependabot-actor-poc'
    steps:
      - name: Approve yarn.lock-only PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            console.log("files:", files.map(f => f.filename));
            if (files.some(file => !file.filename.endsWith("yarn.lock"))) {
              console.log("Skipping approval since some files are not yarn.lock");
              return;
            }
            await github.rest.pulls.createReview({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "APPROVE",
            });
            console.log("APPROVED");
